name: Terraform CI

on:
  push:
    branches:
      - features/sujeet

  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:

  terraform:
    name: Terraform Validate and Plan (${{ matrix.environment }})

    runs-on: ubuntu-latest

    strategy:
      matrix:
        environment:
          - preprod
          - prod

    defaults:
      run:
        working-directory: ./environment/${{ matrix.environment }}

    steps:

      # Checkout GitHub repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # Install Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # Login to Azure using GitHub OIDC
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: 31efd5f3-590c-4ed3-9796-e021d7905ae8
          tenant-id: ced5781c-1212-48f2-8dde-57e09383d9ee
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Initialize Terraform
      - name: Terraform Init
        run: terraform init

      # Validate Terraform configuration
      - name: Terraform Validate
        run: terraform validate

      # Generate Terraform execution plan
      - name: Terraform Plan
        run: terraform plan